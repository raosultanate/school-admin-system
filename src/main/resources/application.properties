spring.application.name=SchoolAdminSystem

# Prints the actual SQL Hibernate generates -- DDL at startup (table creation), and later
# every query. format_sql makes multi-line output instead of one long line. Learning-time
# convenience; a real production app would turn this off (or down to DEBUG-only) since it's
# noisy and can leak data in logs.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
